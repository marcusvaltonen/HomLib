version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  apt_packages:
    - libeigen3-dev
    - build-essential
    - cmake
    - libboost-dev
    - libboost-system-dev
    - libopencv-dev
    - libgflags-dev
    - libomp-dev
  jobs:
    post_checkout:
      - git submodule update --init --recursive

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    - method: pip
      path: .
    - requirements: docs/requirements.txt
